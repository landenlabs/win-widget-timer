name: Build and Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: dotnet publish WinWidgetTimer.csproj -c Release --self-contained false -o publish

    - name: Zip artifacts
      run: Compress-Archive -Path publish\* -DestinationPath WinWidgetTimer.zip

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinWidgetTimer
        path: WinWidgetTimer.zip
        retention-days: 30

    - name: Create GitHub Release and attach zip
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: WinWidgetTimer.zip
